# Example only: create forgejo-runner and forgejo-jobs namespaces first,
# and replace the plugin image. Run the trusted Runner in forgejo-runner.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-runner-kubernetes
  namespace: forgejo-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-runner-kubernetes
  namespace: forgejo-jobs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-runner-kubernetes
  namespace: forgejo-jobs
subjects:
  - kind: ServiceAccount
    name: forgejo-runner-kubernetes
    namespace: forgejo-runner
roleRef:
  kind: Role
  name: forgejo-runner-kubernetes
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner-kubernetes
  namespace: forgejo-runner
spec:
  replicas: 1
  selector:
    matchLabels: {app: forgejo-runner-kubernetes}
  template:
    metadata:
      labels: {app: forgejo-runner-kubernetes}
    spec:
      serviceAccountName: forgejo-runner-kubernetes
      containers:
        - name: plugin
          image: ghcr.io/REPLACE_ME/forgejo-runner-kubernetes:dev
          ports:
            - {name: grpc, containerPort: 50051}
          env:
            - {name: JOB_NAMESPACE, value: forgejo-jobs}
            - {name: JOB_IMAGE, value: 'ubuntu:24.04'}
            - {name: JOB_ARCH, value: arm64}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo-runner-kubernetes
  namespace: forgejo-runner
spec:
  selector: {app: forgejo-runner-kubernetes}
  ports:
    - {name: grpc, port: 50051, targetPort: grpc}
