# Example only: create forgejo-runner and forgejo-jobs namespaces first,
# and replace the plugin image. Run the trusted Runner in forgejo-runner.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-runner-kubernetes
  namespace: forgejo-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-runner-kubernetes
  namespace: forgejo-jobs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-runner-kubernetes
  namespace: forgejo-jobs
subjects:
  - kind: ServiceAccount
    name: forgejo-runner-kubernetes
    namespace: forgejo-runner
roleRef:
  kind: Role
  name: forgejo-runner-kubernetes
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner-kubernetes
  namespace: forgejo-runner
spec:
  replicas: 1
  selector:
    matchLabels: {app: forgejo-runner-kubernetes}
  template:
    metadata:
      labels: {app: forgejo-runner-kubernetes}
    spec:
      serviceAccountName: forgejo-runner-kubernetes
      containers:
        - name: plugin
          image: ghcr.io/REPLACE_ME/forgejo-runner-kubernetes:dev
          ports:
            - {name: grpc, containerPort: 50051}
          env:
            - {name: JOB_NAMESPACE, value: forgejo-jobs}
            - {name: JOB_IMAGE, value: 'ubuntu:24.04'}
            - {name: JOB_ARCH, value: arm64}
            # Optional: omit JOB_APPARMOR_PROFILE to retain the node/runtime default.
            # On affected containerd nodes only, an operator may set it to unconfined.
            # - {name: JOB_APPARMOR_PROFILE, value: unconfined}
            # Job resource controls added in alpha.12: CPU limit omitted.
            # CPU request guides scheduling; it is not a ceiling. Empty uses defaults;
            # exact 'none' omits a CPU/memory field. Job and daemon budgets differ.
            # - {name: JOB_CPU_REQUEST, value: 100m}
            # - {name: JOB_CPU_LIMIT, value: '2'} # optional ceiling; normally leave unset
            # - {name: JOB_MEMORY_REQUEST, value: 128Mi}
            # - {name: JOB_MEMORY_LIMIT, value: 1Gi}
            # Raise workspace and total ephemeral limits together for larger builds.
            - {name: JOB_WORKSPACE_SIZE_LIMIT, value: 1Gi}
            - {name: JOB_EPHEMERAL_STORAGE_REQUEST, value: 256Mi}
            - {name: JOB_EPHEMERAL_STORAGE_LIMIT, value: 2Gi}
            # Opt-in only: requires Privileged PSA in the JOB namespace.
            # The plugin container below stays nonprivileged.
            - {name: JOB_DIND_ENABLED, value: 'false'}
            # Supply your trusted digest before setting true; example ARM64/amd64 index:
            # - {name: JOB_DIND_IMAGE, value: 'docker.io/library/docker@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0'}
            # Daemon budgets (defaults shown); raise coherently for real builds.
            # - {name: JOB_DIND_CPU_REQUEST, value: 100m}
            # - {name: JOB_DIND_CPU_LIMIT, value: '2'}
            # - {name: JOB_DIND_MEMORY_REQUEST, value: 128Mi}
            # - {name: JOB_DIND_MEMORY_LIMIT, value: 2Gi}
            # - {name: JOB_DIND_DATA_SIZE_LIMIT, value: 10Gi}
            # - {name: JOB_DIND_EPHEMERAL_STORAGE_REQUEST, value: 1Gi}
            # - {name: JOB_DIND_EPHEMERAL_STORAGE_LIMIT, value: 12Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo-runner-kubernetes
  namespace: forgejo-runner
spec:
  selector: {app: forgejo-runner-kubernetes}
  ports:
    - {name: grpc, port: 50051, targetPort: grpc}
