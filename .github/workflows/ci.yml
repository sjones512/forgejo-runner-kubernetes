name: bootstrap CI
# PRs and manual dispatch validate development. A version tag runs validation,
# builds the image once, and publishes it in the same workflow run. Pushing main
# before tagging no longer starts a duplicate release-validation pipeline.
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/forgejo-runner-kubernetes
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/forgejo-runner-kubernetes-arm64 ./cmd/forgejo-runner-kubernetes
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          tags: ${{ github.ref_type == 'tag' && format('ghcr.io/{0}:{1}', github.repository, github.ref_name) || 'forgejo-runner-kubernetes:ci' }}
  publish:
    # No 'latest' and no publishing from PRs, dispatches or unvalidated branches.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release binaries and record immutable digest
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "dist/forgejo-runner-kubernetes-linux-$arch" ./cmd/forgejo-runner-kubernetes
          done
          (cd dist && sha256sum forgejo-runner-kubernetes-linux-* > SHA256SUMS)
          printf 'ghcr.io/%s@%s\n' "${GITHUB_REPOSITORY,,}" "$IMAGE_DIGEST" > dist/OCI-IMAGE.txt
          printf 'Experimental integration build; not production-ready.\n\nOCI image (pin this digest):\n\n`%s`\n\nForgejo Runner v13.2.0 / plugin.v1alpha. See docs/cluster-integration.md.\n' "$(<dist/OCI-IMAGE.txt)" > dist/RELEASE-NOTES.md
      - name: Publish GitHub prerelease and binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "$GITHUB_REF_NAME" --notes-file dist/RELEASE-NOTES.md dist/forgejo-runner-kubernetes-linux-* dist/SHA256SUMS dist/OCI-IMAGE.txt
